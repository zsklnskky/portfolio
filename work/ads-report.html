<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Утренний отчёт по рекламе</title>
<style>
:root{--bg:#EEF0EC;--card:#fff;--ink:#1B1E24;--mut:#6A707C;--line:#E2E4DF;--g:#1F8A70;--m:#6C4BD8;--warn:#B8650F;--bad:#C2412F;--ok:#1F8A70;--tg:#2AABEE}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.35 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding:clamp(10px,1.6vw,22px)}
.wrap{max-width:1240px;margin:0 auto;display:grid;gap:12px;grid-template-columns:repeat(12,1fr);grid-auto-rows:min-content}
header{grid-column:1/-1;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.01em}
header .when{color:var(--mut)}
.src{display:flex;gap:6px;margin-left:auto}
.src span{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:12px}
.src i{width:8px;height:8px;border-radius:50%}
.sample{padding:5px 10px;border-radius:6px;background:#FFF4D6;color:#7A5200;font-weight:700;font-size:12px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.kpis{grid-column:1/-1;display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.k{position:relative;overflow:hidden}
.k small{display:block;color:var(--mut);font-weight:600}
.k b{display:block;margin-top:4px;font-size:24px;font-weight:800;letter-spacing:-.02em}
.k em{font-style:normal;font-size:12px;font-weight:700}
.k em.up{color:var(--ok)}.k em.dn{color:var(--bad)}
.k svg{position:absolute;right:10px;bottom:10px;width:56px;height:22px;overflow:visible}
.k svg path{fill:none;stroke:var(--g);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
h2{margin:0 0 10px;font-size:14px;font-weight:800}
h2 span{color:var(--mut);font-weight:600}
.chart{grid-column:1/8}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mut);margin:-4px 0 8px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.chart svg{width:100%;height:200px;display:block;overflow:visible}
.chart .grid line{stroke:var(--line)}
.chart .ax text{fill:var(--mut);font-size:10px}
.ln{fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.area{opacity:.12}
.side{grid-column:8/-1;grid-row:span 2;display:grid;gap:12px;align-content:start}
.issues ul,.tips ol{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.issues li{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:9px 10px;border-radius:10px;background:#FAFAF8;border:1px solid var(--line)}
.issues .sev{grid-row:span 2;margin-top:4px;width:9px;height:9px;border-radius:50%}
.issues b{font-size:13px}
.issues span{color:var(--mut);font-size:12px}
.sev.hi{background:var(--bad)}.sev.md{background:var(--warn)}
.tips li{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start;min-height:34px}
.tips li i{display:grid;place-items:center;width:22px;height:22px;border-radius:7px;background:var(--ink);color:#fff;font-style:normal;font-weight:800;font-size:12px}
.tips li p{margin:1px 0 0}
.caret{display:inline-block;width:2px;height:1em;background:var(--ink);vertical-align:-2px;margin-left:1px}
.langs{grid-column:1/8}
table{width:100%;border-collapse:collapse}
th,td{text-align:right;padding:7px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mut);font-weight:600;font-size:12px}
th:first-child,td:first-child{text-align:left}
td.bar{width:34%;text-align:left}
td.bar span{display:block;height:8px;border-radius:4px;background:var(--g);transform-origin:left}
td.bar span.w{background:var(--warn)}
tr:last-child td{border-bottom:0}
.tg{position:fixed;left:clamp(10px,1.6vw,22px);bottom:clamp(10px,1.6vw,22px);width:min(340px,calc(100vw - 20px));display:grid;grid-template-columns:38px 1fr auto;gap:10px;align-items:start;padding:11px 12px;border-radius:16px;background:rgba(255,255,255,.96);box-shadow:0 18px 40px -12px rgba(27,30,36,.35),0 0 0 1px rgba(27,30,36,.06);z-index:5}
.tg .av{width:38px;height:38px;border-radius:50%;background:var(--tg);display:grid;place-items:center}
.tg b{display:block;font-size:13px}
.tg p{margin:2px 0 0;font-size:12.5px;color:#3B414C}
.tg small{color:var(--mut);font-size:11px}
@media (max-width:820px){
  .kpis{grid-template-columns:repeat(3,1fr)}
  .chart,.langs,.side{grid-column:1/-1;grid-row:auto}
}
@media (max-width:520px){
  body{font-size:12.5px}
  .kpis{grid-template-columns:repeat(2,1fr);gap:8px}
  .k b{font-size:20px}
  .src{margin-left:0}
  td.bar{display:none}
  .k svg{display:none}
  .chart svg{height:150px}
}
</style>
</head>
<body>
<div class="wrap">
  <header data-a="0">
    <h1 data-t="title"></h1><span class="when" data-t="when"></span>
    <div class="src"><span><i style="background:var(--g)"></i>Google Ads</span><span><i style="background:var(--m)"></i>Meta Ads</span></div>
    <span class="sample" data-t="sample"></span>
  </header>
  <section class="kpis" id="kpis"></section>
  <section class="box chart" data-a="1.6">
    <h2 data-t="chartH"></h2>
    <div class="legend"><span><i style="background:var(--g)"></i>Google</span><span><i style="background:var(--m)"></i>Meta</span></div>
    <svg id="ch" viewBox="0 0 600 170" preserveAspectRatio="none"></svg>
  </section>
  <aside class="side">
    <section class="box issues" data-a="3.8"><h2 data-t="issuesH"></h2><ul id="iss"></ul></section>
    <section class="box tips" data-a="6.2"><h2 data-t="tipsH"></h2><ol id="tips"></ol></section>
  </aside>
  <section class="box langs" data-a="2.4">
    <h2 data-t="langH"></h2>
    <table><thead><tr><th data-t="thLang"></th><th data-t="thSpend"></th><th data-t="thLeads"></th><th data-t="thCpl"></th><th></th></tr></thead><tbody id="lg"></tbody></table>
  </section>
</div>
<div class="tg" id="tg" aria-live="polite">
  <div class="av"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M21.5 4.3 18.4 19c-.2 1-.9 1.3-1.7.8l-4.7-3.5-2.3 2.2c-.3.3-.5.5-1 .5l.3-4.8 8.8-7.9c.4-.3-.1-.5-.6-.2L6.3 13 1.6 11.5c-1-.3-1-1 .2-1.5L20.2 3c.9-.3 1.6.2 1.3 1.3z"/></svg></div>
  <div><b data-t="tgName"></b><p data-t="tgText"></p></div><small>08:00</small>
</div>
<script>
(() => {
const Q = new URLSearchParams(location.search);
const RU = (Q.get('lang') || navigator.language || 'ru').toLowerCase().startsWith('ru');
const L = (r, e) => RU ? r : e;
const num = (v, d = 0) => v.toLocaleString(RU ? 'ru-RU' : 'en-GB', { minimumFractionDigits: d, maximumFractionDigits: d });
const eur = (v, d = 2) => RU ? num(v, d) + ' €' : '€' + num(v, d);
document.documentElement.lang = RU ? 'ru' : 'en';
document.title = L('Утренний отчёт по рекламе', 'Morning ad report');
const TX = {
  title: L('Утренний отчёт', 'Morning report'), when: L('понедельник, 08:00 · вчера против позавчера', 'Monday, 08:00 · yesterday vs the day before'),
  sample: L('Пример отчёта, цифры условные', 'Sample report, made-up numbers'),
  chartH: L('Заявки по дням', 'Leads per day') + ' <span>· 14 ' + L('дней', 'days') + '</span>',
  issuesH: L('Что не так', 'What is wrong') + ' <span>· 4</span>', tipsH: L('Советы на сегодня', 'To do today'),
  langH: L('По языкам рекламы', 'By ad language'), thLang: L('Язык', 'Language'), thSpend: L('Потрачено', 'Spend'), thLeads: L('Заявки', 'Leads'), thCpl: L('Цена заявки', 'Cost per lead'),
  tgName: L('Бот отчётов', 'Report bot'),
  tgText: L('Отчёт готов: 142,30 €, 38 заявок, 21 запись. 4 проблемы и 3 совета внутри.', 'Report is ready: €142.30, 38 leads, 21 bookings. 4 issues and 3 tips inside.'),
};
document.querySelectorAll('[data-t]').forEach(e => e.innerHTML = TX[e.dataset.t]);

// [label, value, format, delta text, delta good?, sparkline]
const K = [
  [L('Потрачено', 'Spend'), 142.3, v => eur(v), '+6%', null, [9, 11, 10, 12, 11, 13, 14]],
  [L('Клики', 'Clicks'), 1284, v => num(v), '+11%', 1, [7, 8, 8, 10, 9, 11, 13]],
  ['CTR', 3.9, v => num(v, 1) + '%', L('−0,3 п.п.', '−0.3 pp'), 0, [12, 12, 11, 12, 11, 10, 10]],
  [L('Цена клика', 'Cost per click'), .11, v => eur(v), '−4%', 1, [12, 11, 12, 10, 11, 10, 9]],
  [L('Заявки / записи', 'Leads / bookings'), 38, v => num(v) + ' / ' + num(Math.round(v * 21 / 38)), '+9', 1, [6, 7, 7, 9, 8, 10, 12]],
  [L('Цена заявки', 'Cost per lead'), 3.74, v => eur(v), '−12%', 1, [13, 12, 12, 11, 10, 10, 8]],
];
const spark = a => { const mx = Math.max(...a), mn = Math.min(...a); return 'M' + a.map((y, i) => `${(i / (a.length - 1) * 56).toFixed(1)},${(22 - (y - mn) / (mx - mn || 1) * 20 - 1).toFixed(1)}`).join('L') };
document.getElementById('kpis').innerHTML = K.map(([l, , , d, good, s], i) => `<div class="box k" data-a="${.5 + i * .09}"><small>${l}</small><b>0</b><em class="${good == null ? '' : good ? 'up' : 'dn'}">${d} ${L('к позавчера', 'vs day before')}</em><svg viewBox="0 0 56 22"><path d="${spark(s)}" pathLength="1"/></svg></div>`).join('');

const GS = [14, 16, 15, 18, 17, 20, 19, 21, 22, 20, 24, 23, 25, 26], MS = [12, 11, 13, 12, 14, 13, 12, 11, 12, 10, 11, 12, 11, 12];
const X = i => 30 + i / 13 * 560, Y = v => 150 - v / 30 * 135;
const path = a => a.map((v, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join('');
document.getElementById('ch').innerHTML = `<g class="grid">${[0, 10, 20, 30].map(v => `<line x1="30" x2="590" y1="${Y(v)}" y2="${Y(v)}"/>`).join('')}</g>
  <g class="ax">${[0, 10, 20, 30].map(v => `<text x="22" y="${Y(v) + 3}" text-anchor="end">${v}</text>`).join('')}</g>
  <defs><clipPath id="cl"><rect id="clr" x="0" y="0" width="0" height="170"/></clipPath></defs>
  <g clip-path="url(#cl)"><path class="area" fill="var(--g)" d="${path(GS)}L${X(13)},150L${X(0)},150Z"/>
  <path class="ln" stroke="var(--g)" d="${path(GS)}"/><path class="ln" stroke="var(--m)" d="${path(MS)}"/>
  <circle cx="${X(13)}" cy="${Y(26)}" r="4.5" fill="var(--g)"/><circle cx="${X(13)}" cy="${Y(12)}" r="4.5" fill="var(--m)"/></g>`;

const LG = [['RU', 58.1, 18], ['EN', 61.7, 15], ['EL', 22.5, 5]];
document.getElementById('lg').innerHTML = LG.map(([l, s, n]) => { const c = s / n; return `<tr><td><b>${l}</b></td><td>${eur(s)}</td><td>${n}</td><td>${eur(c)}</td><td class="bar"><span class="${c > 4 ? 'w' : ''}" style="width:${(3.23 / c * 100).toFixed(0)}%"></span></td></tr>` }).join('');

const ISS = [
  ['hi', L('Ключ «массаж недорого»: 9,80 € и ни одной заявки за 3 дня', 'Keyword "cheap massage": €9.80 and zero leads in 3 days'), L('Google, RU · съедает 7% бюджета', 'Google, RU · eats 7% of the budget')],
  ['hi', L('Креатив «Видео 2» выгорел: CTR 3,1% → 1,4% за неделю', 'Creative "Video 2" is burnt out: CTR 3.1% → 1.4% in a week'), L('Meta · частота показа 4,2', 'Meta · frequency 4.2')],
  ['md', L('EN-кампания: CTR −28% к прошлой неделе', 'EN campaign: CTR −28% week over week'), L('объявления не менялись 30 дней', 'ads unchanged for 30 days')],
  ['md', L('6 нецелевых запросов: «курсы массажа», «работа массажистом»', '6 off-target searches: "massage course", "massage therapist job"'), L('потрачено 4,20 € впустую', '€4.20 wasted')],
];
document.getElementById('iss').innerHTML = ISS.map(([s, b, d], i) => `<li data-a="${4.1 + i * .45}"><i class="sev ${s}"></i><b>${b}</b><span>${d}</span></li>`).join('');
const TIPS = [
  L('Добавить 6 минус-слов и выключить «массаж недорого»: минус ~3 € расхода в день.', 'Add 6 negative keywords and pause "cheap massage": about €3 a day saved.'),
  L('Заменить «Видео 2» новым роликом, освободившийся бюджет отдать Google RU, там заявка дешевле всего: 3,23 €.', 'Swap "Video 2" for a fresh clip and move the freed budget to Google RU, the cheapest lead at €3.23.'),
  L('Обновить EN-объявления: два новых заголовка с ценой и ближайшей свободной датой.', 'Refresh the EN ads: two new headlines with the price and the next free slot.'),
];
const tipsEl = document.getElementById('tips');
tipsEl.innerHTML = TIPS.map((_, i) => `<li><i>${i + 1}</i><p></p></li>`).join('');
const tipPs = [...tipsEl.querySelectorAll('p')];

/* one pure function of time: the same frame for live play, reduced motion and the recorded clip */
const LOOP = 16, ease = x => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3), cl = x => Math.min(1, Math.max(0, x));
const appear = [...document.querySelectorAll('[data-a]')].map(e => [e, +e.dataset.a]);
const kb = [...document.querySelectorAll('.k b')], ksp = [...document.querySelectorAll('.k svg path')];
const clr = document.getElementById('clr'), bars = [...document.querySelectorAll('td.bar span')], tg = document.getElementById('tg');
let lastTyped = '';
function render(t) {
  const out = t > LOOP - .7 ? 1 - cl((t - (LOOP - .7)) / .6) : 1;
  document.body.style.opacity = out;
  appear.forEach(([e, a]) => { const k = ease((t - a) / .5); e.style.opacity = k; e.style.transform = `translateY(${(1 - k) * 10}px)` });
  K.forEach(([, v, f], i) => { kb[i].textContent = f(v * ease((t - .7 - i * .09) / 1.3)); ksp[i].style.strokeDasharray = '1'; ksp[i].style.strokeDashoffset = 1 - ease((t - 1.1 - i * .09) / 1) });
  clr.setAttribute('width', 600 * cl((t - 1.9) / 2));
  bars.forEach((b, i) => b.style.transform = `scaleX(${ease((t - 2.8 - i * .15) / .8)})`);
  // advice is typed, 38 characters a second, one after another
  let at = 6.3; const typed = TIPS.map(s => { const n = Math.floor(cl((t - at) * 62 / s.length) * s.length); at += s.length / 62 + .3; return n });
  const key = typed.join();
  if (key !== lastTyped) { lastTyped = key; tipPs.forEach((p, i) => { const n = typed[i], full = n >= TIPS[i].length, busy = n > 0 && !full; p.innerHTML = TIPS[i].slice(0, n).replace(/&/g, '&amp;').replace(/</g, '&lt;') + (busy ? '<span class="caret"></span>' : '') }) }
  const g = ease((t - 11.9) / .5); tg.style.opacity = g; tg.style.transform = `translateY(${(1 - g) * -24}px) scale(${.96 + g * .04})`;
}
window.__seek = render;
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
if (Q.has('rec')) render(0);
else if (still) render(13);
else { const t0 = performance.now(); const tick = now => { render(((now - t0) / 1000) % LOOP); requestAnimationFrame(tick) }; requestAnimationFrame(tick) }
})();
</script>
</body>
</html>
